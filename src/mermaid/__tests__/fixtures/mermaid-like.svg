<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" id="my-svg" width="240" height="120" viewBox="0 0 240 120">
  <style>
    #my-svg {
      font-family: "trebuchet ms", verdana, arial, sans-serif;
    }

    #my-svg .node rect {
      fill: #fff4dd;
      stroke: #7a5;
      stroke-width: 1.5px;
    }

    #my-svg .edgePath path {
      stroke: #333;
      stroke-width: 1.5px;
      fill: none;
    }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>
  <g class="node default" transform="translate(20, 20)">
    <rect x="0" y="0" width="80" height="36" rx="4" ry="4" style="max-width: 80px; background-color: rgba(255, 244, 221, 0.9);" />
    <text x="40" y="22" text-anchor="middle">Start</text>
  </g>
  <g class="node default" transform="translate(140, 20)">
    <rect x="0" y="0" width="80" height="36" rx="4" ry="4" style="max-width: 80px; background-color: rgba(221, 244, 255, 0.9);" />
    <text x="40" y="22" text-anchor="middle">End</text>
  </g>
  <path class="edgePath" d="M100 38 L140 38" marker-end="url(#arrowhead)" />
</svg>
